
name: Consultar cargos do Roblox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar-cargos:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar cargos do grupo
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          GROUP_ID = "940868075"
          API_KEY = os.environ.get("ROBLOX_API_KEY", "")

          if not API_KEY:
              raise SystemExit(
                  "ERRO: configure o segredo ROBLOX_API_KEY no GitHub."
              )

          url = f"https://apis.roblox.com/cloud/v2/groups/{GROUP_ID}/roles"

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": API_KEY,
                  "Content-Type": "application/json"
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  data = json.loads(response.read().decode("utf-8"))

              roles = (
                  data.get("groupRoles")
                  or data.get("roles")
                  or []
              )

              if not roles:
                  print("Resposta recebida, mas não encontrei a lista de cargos.")
                  print("Campos recebidos:", list(data.keys()))
                  print(json.dumps(data, ensure_ascii=False, indent=2))
                  raise SystemExit(1)

              print("CARGOS DO EXÉRCITO BRASILEIRO LEGEND")
              print("-------------------------------------")

              for role in roles:
                  name = role.get("displayName") or role.get("name", "Sem nome")
                  role_id = role.get("id") or role.get("path", "ID não encontrado")
                  rank = role.get("rank", "N/A")

                  print(f"Patente: {name} | ID: {role_id} | Rank: {rank}")

          except urllib.error.HTTPError as error:
              print("Erro da API Roblox:", error.code)
              print(error.read().decode("utf-8"))
              raise SystemExit(1)

          except Exception as error:
              print("Erro:", str(error))
              raise SystemExit(1)
          PY
          
